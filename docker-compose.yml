# Ядро таск-менеджера: Postgres + ClickHouse + Kafka + приложение.
# Парсер — отдельный docker-compose, общается через Kafka.
#
# Запуск:    docker compose up -d --build
# Остановка: docker compose down
# Логи:      docker compose logs -f taskmanager

services:
  postgres:
    image: postgres:16
    container_name: tm-postgres
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: "Europe/Moscow"
    # Порт наружу НЕ пробрасываем — Postgres доступен только внутри compose.
    # Для дампов/отладки с хоста раскомментируй временно:
    # ports:
    #   - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tm-clickhouse
    environment:
      CLICKHOUSE_DB: taskmanager
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: "Europe/Moscow"
    # Порты наружу НЕ пробрасываем. Для отладки с хоста раскомментируй:
    # ports:
    #   - "8123:8123"
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./backups:/backups
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d   # авто-накат схемы при первом старте
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7-alpine
    container_name: tm-redis
    ports:
      - "6379:6379"          # нужен наружу — к нему подключаются парсеры-воркеры
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskmanager:
    build: .
    container_name: tm-app
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"          # API наружу
    environment:
      SPRING_DATA_REDIS_HOST: "tm-redis"
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://tm-postgres:5432/taskmanager"
      SPRING_DATASOURCE_USERNAME: "taskmanager"
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_URL: "jdbc:clickhouse://tm-clickhouse:8123/taskmanager"
      CLICKHOUSE_USERNAME: "default"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      PARSER_OZON_URL: "http://host.docker.internal:8010"
      PARSER_API_KEY: ${PARSER_API_KEY}
      TZ: "Europe/Moscow"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pg-data:
  ch-data:
  redis-data: