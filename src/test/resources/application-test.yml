spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/taskmanager
    username: taskmanager
    password: localtest
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
clickhouse:
  url: jdbc:clickhouse://localhost:8123/taskmanager?user=default&password=localtest
  username: default
  password: localtest
main:
  allow-bean-definition-overriding: true
taskmanager:
  geo: Санкт-Петербург
  monitoring:
    queue-buffer: 10
    refill-interval-ms: 10000
    inflight-timeout-minutes: 15
  redis:
    parse-tasks-prefix: parse:tasks
    parse-results-prefix: parse:results
    select-tasks-prefix: select:tasks
    select-results-prefix: select:results